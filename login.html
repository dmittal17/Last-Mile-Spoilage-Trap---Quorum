<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUORUM — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface2: #F1F5F9;
  --border: #E2E8F0;
  --border-focus: #4ADE80;
  --green: #22C55E;
  --green-pastel: #86EFAC;
  --green-light: #ECFDF5;
  --green-text: #15803D;
  --yellow: #EAB308;
  --yellow-pastel: #FDE047;
  --yellow-light: #FEF9C3;
  --yellow-text: #854D0E;
  --red: #EF4444;
  --red-light: #FEF2F2;
  --slate: #64748B;
  --text: #0F172A;
  --text2: #475569;
  --text3: #94A3B8;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);overflow:hidden}

/* Soft animated pastel background */
.grid-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.grid-bg::before{
  content:'';position:absolute;inset:-50%;width:200%;height:200%;
  background-image:
    linear-gradient(rgba(34,197,94,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(234,179,8,.07) 1px,transparent 1px);
  background-size:54px 54px;
  animation:gridDrift 28s linear infinite;
}
@keyframes gridDrift{0%{transform:translate(0,0)}100%{transform:translate(54px,54px)}}

/* Ambient pastel gradient blobs */
.glow{position:fixed;width:550px;height:550px;border-radius:50%;filter:blur(110px);opacity:.35;z-index:0;pointer-events:none}
.glow-1{background:#BBF7D0;top:-180px;left:45%;transform:translateX(-50%)}
.glow-2{background:#FEF08A;bottom:-180px;right:-100px}
.glow-3{background:#DCFCE7;bottom:-150px;left:-100px}

.login-wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px}

/* Logo */
.logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo-icon{
  width:42px;height:42px;
  background:linear-gradient(135deg,#4ADE80 0%,#FACC15 100%);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(34,197,94,.25);
}
.logo-icon svg{width:22px;height:22px;fill:none;stroke:#0F172A;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--text)}
.tagline{font-size:13px;color:var(--text2);margin-bottom:28px;letter-spacing:.3px;font-weight:500}

/* Card */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:34px 32px 26px;width:100%;max-width:410px;
  box-shadow:0 12px 40px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
}

/* Role selector */
.role-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.role-btn{
  padding:10px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);
  color:var(--text2);font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s ease;
}
.role-btn:hover{border-color:var(--green-pastel);color:var(--text);background:var(--green-light)}
.role-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.role-btn.active{border-color:var(--green);background:var(--green-light);color:var(--green-text);box-shadow:0 2px 8px rgba(34,197,94,.15)}
.role-btn span.role-icon{font-size:18px}

/* Inputs */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:6px}
.field input{
  width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-family:var(--sans);font-size:14px;
  transition:all .15s ease;outline:none;
}
.field input::placeholder{color:var(--text3)}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.2)}
.field input.error-border{border-color:var(--red)}

/* Error message */
.error-msg{
  font-size:12px;color:var(--red);background:var(--red-light);
  border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px 12px;
  margin-bottom:14px;display:none;align-items:center;gap:6px;font-weight:500;
}
.error-msg.show{display:flex}

/* Buttons */
.btn-primary{
  width:100%;padding:12px;border-radius:10px;border:none;
  background:linear-gradient(135deg,#22C55E 0%,#16A34A 100%);
  color:#FFFFFF;font-family:var(--sans);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .15s ease;letter-spacing:.3px;
  box-shadow:0 4px 14px rgba(34,197,94,.3);
}
.btn-primary:hover{background:linear-gradient(135deg,#16A34A 0%,#15803D 100%);box-shadow:0 6px 18px rgba(34,197,94,.4);transform:translateY(-1px)}
.btn-primary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn-primary:active{transform:scale(.98)}

.btn-guest{
  width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--yellow-light);color:var(--yellow-text);font-family:var(--sans);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s ease;border-color:rgba(234,179,8,.3);
}
.btn-guest:hover{background:#FEF08A;border-color:var(--yellow);color:#713F12;box-shadow:0 2px 10px rgba(234,179,8,.2)}
.btn-guest:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Demo hint */
.demo-hint{
  margin-top:20px;font-size:11px;color:var(--text2);text-align:center;line-height:1.6;
  background:var(--surface2);padding:10px;border-radius:10px;border:1px solid var(--border);
}
.demo-hint code{font-family:var(--mono);color:var(--green-text);font-size:11px;background:var(--green-light);padding:1px 5px;border-radius:4px;font-weight:600}
.footnote{text-align:center;margin-top:14px;font-size:11px;color:var(--text3);letter-spacing:.2px;font-weight:500}

@media(max-width:480px){
  .card{padding:26px 20px 20px}
  .role-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="login-wrapper">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
    </div>
    <span class="logo-text">QUORUM</span>
  </div>
  <p class="tagline">Zero-waste last-mile coordination console</p>

  <div class="card">
    <form id="login-form" autocomplete="off">
      <!-- Role selector -->
      <div class="role-row" id="role-row">
        <button type="button" class="role-btn active" data-role="Coordinator" aria-pressed="true">
          <span class="role-icon">🎯</span>Coordinator
        </button>
        <button type="button" class="role-btn" data-role="Rider" aria-pressed="false">
          <span class="role-icon">🛵</span>Rider
        </button>
        <button type="button" class="role-btn" data-role="Donor" aria-pressed="false">
          <span class="role-icon">🍱</span>Donor
        </button>
        <button type="button" class="role-btn" data-role="Shelter" aria-pressed="false">
          <span class="role-icon">🏠</span>Shelter
        </button>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="coordinator@quorum.demo" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="error-msg" id="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="error-text">Invalid credentials</span>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>

      <div class="divider">or</div>

      <button type="button" class="btn-guest" id="guest-btn">Continue as guest / judge →</button>
    </form>

    <div class="demo-hint">
      Demo account: <code>coordinator@quorum.demo</code> / <code>demo1234</code><br>
      Also: <code>rider@quorum.demo</code>, <code>donor@quorum.demo</code>, <code>shelter@quorum.demo</code>
    </div>
  </div>
  <p class="footnote">⚡ Demo authentication — zero credentials transmitted</p>
</div>

<script>
const DEMO_ACCOUNTS = {
  'coordinator@quorum.demo': {password:'demo1234', name:'Demo Coordinator', role:'Coordinator'},
  'rider@quorum.demo':       {password:'demo1234', name:'Demo Rider',       role:'Rider'},
  'donor@quorum.demo':       {password:'demo1234', name:'Demo Donor',       role:'Donor'},
  'shelter@quorum.demo':     {password:'demo1234', name:'Demo Shelter',     role:'Shelter'},
};

let selectedRole = 'Coordinator';

// Role selection
document.getElementById('role-row').addEventListener('click', e => {
  const btn = e.target.closest('.role-btn');
  if (!btn) return;
  document.querySelectorAll('.role-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
  btn.classList.add('active');
  btn.setAttribute('aria-pressed','true');
  selectedRole = btn.dataset.role;
});

// Login
document.getElementById('login-form').addEventListener('submit', e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass  = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const errText = document.getElementById('error-text');

  errEl.classList.remove('show');
  document.getElementById('email').classList.remove('error-border');
  document.getElementById('password').classList.remove('error-border');

  const acct = DEMO_ACCOUNTS[email];
  if (!acct || acct.password !== pass) {
    errText.textContent = 'Invalid email or password. Try coordinator@quorum.demo / demo1234';
    errEl.classList.add('show');
    document.getElementById('email').classList.add('error-border');
    document.getElementById('password').classList.add('error-border');
    return;
  }

  sessionStorage.setItem('quorum_user', JSON.stringify({
    name: acct.name,
    role: acct.role,
    email: email
  }));
  window.location.href = '/dashboard';
});

// Guest
document.getElementById('guest-btn').addEventListener('click', () => {
  sessionStorage.setItem('quorum_user', JSON.stringify({
    name: 'Judge',
    role: selectedRole,
    email: 'guest'
  }));
  window.location.href = '/dashboard';
});

if (sessionStorage.getItem('quorum_user')) {
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
